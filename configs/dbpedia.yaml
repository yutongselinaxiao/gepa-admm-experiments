    F: "Means of transportation"
    G: "Building"
    H: "Natural place"
    I: "Village"
    J: "Animal"
    K: "Plant"
    L: "Album"
    M: "Film"
    N: "Written work"
  enable_thinking: false

data:
  dataset_name: fancyzhx/dbpedia_14
  seed: 20261002
  train_size: 896
  validation_size: 1792

manual_instructions:
  - "Identify what kind of thing the abstract is about, map it to the listed entity types, and answer with only one label letter."
  - "Focus on the main subject of the abstract rather than places or people it mentions. Return exactly one label letter."
  - "Decide which of the fourteen listed entity types fits the abstract's subject, then output its mapped letter only."
